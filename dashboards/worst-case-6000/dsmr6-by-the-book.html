<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet dashboard</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root {
  min-height: 100vh;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 32px clamp(16px, 4vw, 48px) 48px;
}
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
h2.section { font-size: 18px; font-weight: 600; margin: 36px 0 2px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.caption, .sub { color: var(--text-secondary); margin: 0; }
.sub { font-size: 13px; margin-bottom: 12px; }
.note { color: var(--text-muted); font-size: 12px; margin: 10px 0 0; }
.wrap { max-width: 1240px; margin: 0 auto; }
nav { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; }
nav a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid var(--axis); }
nav a:hover, nav a:focus-visible { color: var(--text-primary); }
.card {
  background: var(--surface-1);
  border-radius: 12px;
  box-shadow: 0 0 0 1px var(--border);
  padding: 20px 20px 16px;
  margin: 0;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.kpis.lead { grid-template-columns: minmax(230px, 1.4fr) repeat(auto-fit, minmax(150px, 1fr)); }
.tile { padding: 16px 18px; }
.tile .label { color: var(--text-secondary); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
.tile .value small { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.tile .detail { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.tile.hero .value { font-size: 48px; line-height: 1.1; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; margin-bottom: 16px; }
.block { margin: 0 0 16px; }
.empty { color: var(--text-secondary); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .ink2 { fill: var(--text-secondary); }
svg .label { fill: var(--text-secondary); font-size: 12px; }
.mark { cursor: default; outline: none; }
.mark:focus-visible .shape, .mark:hover .shape { opacity: 0.8; }
.mark:focus-visible .hit { stroke: var(--text-secondary); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-secondary); font-size: 12px; margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--axis); }
tbody th { font-weight: 400; }
tbody td, tbody th { border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
.scroll { overflow-x: auto; }
th button { all: unset; cursor: pointer; color: inherit; }
th button:focus-visible { outline: 1px solid var(--text-secondary); outline-offset: 2px; }
th[aria-sort] button::after { content: " ↓"; }
th[aria-sort="ascending"] button::after { content: " ↑"; }
.flag { color: var(--text-secondary); font-size: 12px; margin-left: 4px; }
.flag::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--series-2); margin-right: 4px;
}
.battery { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 28px; padding: 16px 20px; margin: 16px 0; }
.battery .full { flex-basis: 100%; margin: 0; }
.battery .full:empty { display: none; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.field .row { display: flex; align-items: center; gap: 6px; }
.field .label { color: var(--text-secondary); }
.field .hint { color: var(--text-muted); font-size: 12px; }
.field select, .field input {
  font: inherit; color: var(--text-primary); background: var(--page);
  border: 1px solid var(--axis); border-radius: 6px; padding: 6px 8px;
}
.field input { width: 9em; font-variant-numeric: tabular-nums; }
.field select:focus-visible, .field input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
.tag { color: var(--text-muted); font-size: 12px; margin-left: 4px; }
details > summary { cursor: pointer; margin: 0 0 8px; }
details > summary:focus-visible { outline: 1px solid var(--text-secondary); outline-offset: 2px; }
#tooltip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface-1); color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--border), 0 4px 16px rgba(0, 0, 0, 0.12);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 120px;
}
#tooltip .title { color: var(--text-secondary); margin-bottom: 4px; }
#tooltip .row { display: flex; align-items: baseline; gap: 6px; }
#tooltip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tooltip .row span { color: var(--text-secondary); }
#tooltip .key { width: 10px; height: 2px; align-self: center; }
</style>
</head>

<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const info = data.info;
const SVG = "http://www.w3.org/2000/svg";

// ---------- helpers ----------
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function sv(tag, attrs = {}, text) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
// Three significant figures, trailing zeros kept; grouped integers from 100 up.
function fmt(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 100) return Math.round(v).toLocaleString("en-US");
  if (a === 0) return "0";
  return v.toPrecision(3);
}
function int(v) { return (v === null || v === undefined) ? "—" : Math.round(v).toLocaleString("en-US"); }
function pct(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  if (v > 0 && v < 0.001) return "<0.1 %";
  return (100 * v).toFixed(1) + " %";
}
function niceStep(range, count) {
  const raw = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}
function niceScale(lo, hi, count = 5) {
  if (hi === lo) { lo = lo === 0 ? 0 : lo * 0.9; hi = hi === 0 ? 1 : hi * 1.1; }
  const step = niceStep(hi - lo, count);
  const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let t = start; t <= end + step / 2; t += step) ticks.push(Number(t.toPrecision(12)));
  return { lo: start, hi: end, ticks, step };
}
// Whether a scatter is worth drawing: at least three values, with a spread.
function varies(values) { return values.length >= 3 && Math.max(...values) - Math.min(...values) > 1e-9 * Math.max(1, ...values.map(Math.abs)); }
// A run's length in its most readable unit.
function span(days) {
  const s = days * 86400;
  if (s < 120) return `${fmt(s)} s`;
  if (s < 7200) return `${fmt(s / 60)} minutes`;
  if (s < 2 * 86400) return `${fmt(s / 3600)} hours`;
  return `${fmt(days)} days`;
}
function tickFmt(step) {
  const d = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  return v => v.toFixed(d);
}

// ---------- tooltip: values lead, labels follow; same on focus as on hover ----------
const tip = document.getElementById("tooltip");
function showTip(target, event, title, rows) {
  tip.replaceChildren(el("div", { class: "title" }, title));
  for (const r of rows) {
    const row = el("div", { class: "row" });
    if (r.key) { const k = el("i", { class: "key" }); k.style.background = r.key; row.append(k); }
    row.append(el("b", {}, r.value), el("span", {}, r.label));
    tip.append(row);
  }
  tip.style.display = "block";
  let x, y;
  if (event && event.clientX !== undefined) { x = event.clientX; y = event.clientY; }
  else { const b = target.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, x + 14), window.innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }
function interactive(g, label, title, rows) {
  g.setAttribute("class", "mark");
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "img");
  g.setAttribute("aria-label", label);
  g.addEventListener("pointermove", e => showTip(g, e, title, rows));
  g.addEventListener("pointerleave", hideTip);
  g.addEventListener("focus", () => showTip(g, null, title, rows));
  g.addEventListener("blur", hideTip);
}
function columnPath(x, w, y0, y1) {
  const r = Math.min(4, w / 2, y0 - y1);
  return `M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + w - r} Q${x + w},${y1} ${x + w},${y1 + r} V${y0} Z`;
}
function barPath(y, h, x0, x1) {
  const r = Math.min(4, h / 2, x1 - x0);
  return `M${x0},${y} H${x1 - r} Q${x1},${y} ${x1},${y + r} V${y + h - r} Q${x1},${y + h} ${x1 - r},${y + h} H${x0} Z`;
}

// ---------- layout pieces ----------
function sectionHead(root, id, title, sub) {
  root.append(el("h2", { class: "section", id: id + "-h" }, title), el("p", { class: "caption" }, sub));
}
function card(parent, title, sub, cls = "card") {
  const c = el("figure", { class: cls });
  c.append(el("h3", {}, title));
  if (sub) c.append(el("p", { class: "sub" }, sub));
  parent.append(c);
  return c;
}
function tiles(parent, list, lead) {
  const row = el("div", { class: "kpis" + (lead ? " lead" : "") });
  for (const t of list) {
    const d = el("div", { class: "card tile" + (t.hero ? " hero" : "") });
    const v = el("div", { class: "value" }, t.value);
    if (t.unit) v.append(el("small", {}, t.unit));
    d.append(el("div", { class: "label" }, t.label), v);
    if (t.detail) d.append(el("div", { class: "detail" }, t.detail));
    row.append(d);
  }
  parent.append(row);
}

// ---------- charts ----------
// Histogram of counts per bin, with an optional reference line.
function histogram(parent, bins, xTitle, ref, refLabel, width = 560) {
  const W = width, H = 260, m = { l: 40, r: 12, t: 22, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": `Histogram of ${xTitle}` });
  const lo = bins[0].lo, hi = bins[bins.length - 1].hi, span = (hi - lo) || 1;
  const ys = niceScale(0, Math.max(...bins.map(b => b.count)), 4);
  const X = v => m.l + (v - lo) / span * pw, Y = v => m.t + ph - v / ys.hi * ph;
  for (const t of ys.ticks) {
    if (t !== Math.round(t)) continue;
    svg.append(sv("line", { x1: m.l, x2: m.l + pw, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    svg.append(sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, String(t)));
  }
  if (hi > lo) {
    const xs = niceScale(lo, hi, 5), f = tickFmt(xs.step);
    for (const t of xs.ticks) {
      if (t < lo - 1e-12 || t > hi + 1e-12) continue;
      svg.append(sv("text", { x: X(t), y: m.t + ph + 18, "text-anchor": "middle" }, f(t)));
    }
  }
  svg.append(sv("text", { x: m.l + pw / 2, y: H - 4, "text-anchor": "middle", class: "label" }, xTitle));
  svg.append(sv("text", { x: 0, y: 10, class: "label" }, "Nodes"));
  const n = bins.length;
  bins.forEach(b => {
    const x0 = n === 1 ? m.l + pw / 2 - 12 : X(b.lo) + 1, x1 = n === 1 ? m.l + pw / 2 + 12 : X(b.hi) - 1;
    const g = sv("g");
    g.append(sv("rect", { class: "hit", x: x0 - 1, y: m.t, width: x1 - x0 + 2, height: ph, fill: "transparent" }));
    if (b.count > 0) g.append(sv("path", { class: "shape", d: columnPath(x0, x1 - x0, Y(0), Y(b.count)), fill: "var(--series-1)" }));
    interactive(g, `${b.count} nodes between ${fmt(b.lo)} and ${fmt(b.hi)}`, `${fmt(b.lo)} – ${fmt(b.hi)}`,
      [{ value: String(b.count), label: b.count === 1 ? "node" : "nodes" }]);
    svg.append(g);
  });
  svg.append(sv("line", { x1: m.l, x2: m.l + pw, y1: Y(0), y2: Y(0), stroke: "var(--axis)", "stroke-width": 1 }));
  if (ref !== undefined && hi > lo) {
    const xm = X(ref), left = xm > m.l + pw * 0.7;
    svg.append(sv("line", { x1: xm, x2: xm, y1: m.t - 6, y2: Y(0), stroke: "var(--text-secondary)", "stroke-width": 1 }));
    svg.append(sv("text", { x: xm + (left ? -4 : 4), y: m.t - 8, class: "ink2", "text-anchor": left ? "end" : "start" }, refLabel));
  }
  parent.append(svg);
}
// Horizontal bars, one per item, value at the tip.
function hbars(parent, items, ariaLabel, width = 560) {
  const row = 28, labelW = Math.min(220, 24 + 7 * Math.max(...items.map(i => i.label.length)));
  const W = width, m = { l: labelW, r: 72, t: 4, b: 4 }, H = m.t + m.b + row * items.length;
  const pw = W - m.l - m.r;
  const max = Math.max(...items.map(i => i.value), 0) || 1;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": ariaLabel });
  const X = v => m.l + v / max * pw;
  items.forEach((it, i) => {
    const y = m.t + i * row, h = 14, yb = y + (row - h) / 2;

// Scatter of points {x, y, color, title, rows, label}.
function scatter(parent, points, xTitle, yTitle, fmtY, legend, width = 560) {

    }

  }
  const W = width, H = 260, m = { l: 48, r: 12, t: 26, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": `${yTitle} against ${xTitle}` });
  const xs = niceScale(Math.min(0, ...points.map(p => p.x)), Math.max(...points.map(p => p.x)), 5);
  const ys = niceScale(Math.min(...points.map(p => p.y)), Math.max(...points.map(p => p.y)), 4);
  const X = v => m.l + (v - xs.lo) / (xs.hi - xs.lo) * pw, Y = v => m.t + ph - (v - ys.lo) / (ys.hi - ys.lo) * ph;
  const fy = fmtY || tickFmt(ys.step), fx = tickFmt(xs.step);
  for (const t of ys.ticks) {
    svg.append(sv("line", { x1: m.l, x2: m.l + pw, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    svg.append(sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, fy(t)));
  }
  for (const t of xs.ticks) svg.append(sv("text", { x: X(t), y: m.t + ph + 18, "text-anchor": "middle" }, fx(t)));
  svg.append(sv("line", { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, stroke: "var(--axis)", "stroke-width": 1 }));
  svg.append(sv("text", { x: m.l + pw / 2, y: H - 4, "text-anchor": "middle", class: "label" }, xTitle));
  svg.append(sv("text", { x: 0, y: 10, class: "label" }, yTitle));
  for (const p of [...points].sort((a, b) => (a.top ? 1 : 0) - (b.top ? 1 : 0))) {
    const g = sv("g");
    g.append(sv("circle", { class: "hit", cx: X(p.x), cy: Y(p.y), r: 12, fill: "transparent" }));

    interactive(g, p.label, p.title, p.rows);
    svg.append(g);
  }
  parent.append(svg);
}

// ---------- battery projections ----------
const HOURS_PER_YEAR = 8766;
// Hours a battery lasts at `ua` µA: usable capacity over the node's
// current plus self-discharge, taken as a constant drain.
function lifeHours(ua, b) {
  const drain = ua / 1000 + b.self_discharge_per_year * b.capacity_mah / HOURS_PER_YEAR;
  return drain > 0 ? b.usable * b.capacity_mah / drain : Infinity;
}
// The unit a set of durations reads best in, from their median.
function lifeUnit(hours) {
  const y = hours / HOURS_PER_YEAR;
  if (y >= 2) return { name: "years", per: HOURS_PER_YEAR };
  if (y * 12 >= 2) return { name: "months", per: HOURS_PER_YEAR / 12 };
  if (hours / 24 >= 2) return { name: "days", per: 24 };
  return { name: "hours", per: 1 };
}
function lifeText(h) { if (!isFinite(h)) return "—"; const u = lifeUnit(h); return `${fmt(h / u.per)} ${u.name}`; }
// Distribution of values, as radiofreccia_sim::Summary computes it.
function summarize(values) {
  const v = [...values].sort((a, b) => a - b), n = v.length;
  const pick = p => { const r = p * (n - 1), lo = Math.floor(r), hi = Math.ceil(r); return v[lo] + (v[hi] - v[lo]) * (r - lo); };
  const equal = v[n - 1] - v[0] <= 4 * Number.EPSILON * Math.max(Math.abs(v[0]), Math.abs(v[n - 1]));
  const mean = equal ? v[0] : v.reduce((a, b) => a + b, 0) / n;
  const variance = equal ? 0 : v.reduce((a, b) => a + (b - mean) ** 2, 0) / n;
  const std = Math.sqrt(variance);
  return { mean, median: pick(0.5), variance, std_dev: std, cv: mean === 0 ? 0 : std / mean,
    min: v[0], p5: pick(0.05), p25: pick(0.25), p75: pick(0.75), p95: pick(0.95), max: v[n - 1] };
}
// Equal-width bins over the values' range, about √n of them (5 to 20).
function bins(values) {
  const lo = Math.min(...values), hi = Math.max(...values);
  if (hi === lo) return [{ lo, hi, count: values.length }];
  const n = Math.min(20, Math.max(5, Math.ceil(Math.sqrt(values.length)))), w = (hi - lo) / n;
  const out = Array.from({ length: n }, (_, i) => ({ lo: lo + w * i, hi: i + 1 === n ? hi : lo + w * (i + 1), count: 0 }));
  for (const x of values) out[Math.min(n - 1, Math.floor((x - lo) / w))].count++;
  return out;
}

    { label: "Lowest delivery", value: pct(k.worst_delivery), detail: k.worst_label },
  ];
  if (k.median_uj !== null) list.push({ label: "Energy per delivered message", value: fmt(k.median_uj), unit: "µJ", detail: "median over battery nodes, all their links" });
  tiles(root, list);
  const grid = el("div", { class: "grid" }); root.append(grid);
  const withDistance = links.filter(l => l.distance_m !== null);
  const point = (l, y, yLabel, yText) => ({
    x: l.distance_m, y, color: "var(--series-1)", label: `${l.label}: ${yText}`, title: l.label,
    rows: [{ value: yText, label: yLabel }, { value: fmt(l.distance_m) + " m", label: "apart" },
      { value: `${int(l.messages.lost)} of ${int(l.messages.sent)}`, label: "lost" }],
  });
  if (varies(withDistance.map(l => l.distance_m))) {
    const both = varies(withDistance.map(l => l.messages.tx_per_message));
    if (!both) grid.className = "";
    const c1 = card(grid, "Delivery against distance", "Fraction of each link's messages that arrived", both ? "card" : "card block");
    const box = el("div"); if (!both) box.style.maxWidth = "760px"; c1.append(box);
    scatter(box, withDistance.map(l => point(l, 100 * l.messages.delivery, "delivered", pct(l.messages.delivery))),
      "Distance between the two ends (m)", "Delivered (%)", null, null, both ? 560 : 760);
    if (both) {
      const c2 = card(grid, "Transmissions per message against distance", "Retries spent getting messages across");
      scatter(c2, withDistance.map(l => point(l, l.messages.tx_per_message, "transmissions per message", l.messages.tx_per_message.toFixed(2))),
        "Distance between the two ends (m)", "Transmissions per message");
    }
  } else {
    const c1 = card(grid, "Delivery per link", "Fraction of each link's messages that arrived");
    hbars(c1, [...links].sort((a, b) => a.messages.delivery - b.messages.delivery).map(l => ({
      label: l.label, value: l.messages.delivery, text: pct(l.messages.delivery),
      rows: [{ value: pct(l.messages.delivery), label: "delivered" }, { value: `${int(l.messages.lost)} of ${int(l.messages.sent)}`, label: "lost" }],
    })), "Delivery per link");
    const c2 = card(grid, "Transmissions per message per link", "Retries spent getting messages across");
    hbars(c2, [...links].sort((a, b) => b.messages.tx_per_message - a.messages.tx_per_message).map(l => ({
      label: l.label, value: l.messages.tx_per_message, text: l.messages.tx_per_message.toFixed(2),
      rows: [{ value: l.messages.tx_per_message.toFixed(2), label: "transmissions per message" },
        { value: int(l.messages.transmissions), label: "frames on air" }],
    })), "Transmissions per message per link");
  }
  const c3 = card(root, "Statistics over links", "Population statistics over the links that count messages", "card block");
  statsTable(c3, msg.stats, "Per link");
  const c4 = card(root, "Messages per link", "Select a column heading to sort; long tables start collapsed", "card block");
  const cols = [["From", l => l.from_label, ident], ["To", l => l.to_label, ident]];
  const hasDistance = links.some(l => l.distance_m !== null);
  if (hasDistance) cols.push(["Distance (m)", l => l.distance_m, fmt]);
  cols.push(["Sent", l => l.messages.sent, int], ["Delivered", l => l.messages.delivered, int],
    ["Lost", l => l.messages.lost, int], ["Delivery", l => l.messages.delivery, pct],
    ["Frames on air", l => l.messages.transmissions, int], ["Per message", l => l.messages.tx_per_message, v => v.toFixed(2)]);
  nodeTable(c4, links, cols, hasDistance ? 2 : 0, "link");
})();

// ---------- radio ----------
(function () {
  const root = document.getElementById("radio"), totals = data.radio.totals;
  sectionHead(root, "radio", "Radio", "Every node's radio counters, gateways included: what happened to frames on air.");
  const get = key => totals.find(t => t.key === key).value;
  const missed = get("rx_sync_failed") + get("rx_busy") + get("rx_lagged");
  tiles(root, [
    { label: "Frames sent", value: int(get("tx_frames")), detail: "by every node" },
    { label: "Frames received", value: int(get("rx_frames")), detail: "intact, by every node" },
    { label: "Lost to collisions", value: int(get("rx_collisions")), detail: `${int(get("rx_bit_errors"))} more to bit errors` },
    { label: "Missed", value: int(missed), detail: "preamble, sync, busy or lagged" },
    { label: "Receive timeouts", value: int(get("rx_timeouts")), detail: "receives that found nothing" },
  ]);
  const problems = totals.filter(t => !["tx_frames", "rx_frames", "rx_timeouts"].includes(t.key));
  const c1 = card(root, "Events across the fleet", "What became of frames that weren't received intact, and transmissions the radio held back", "card block");
  const box = el("div"); box.style.maxWidth = "760px"; c1.append(box);
  hbars(box, problems.map(t => ({
    label: t.label, value: t.value, text: int(t.value),
    rows: [{ value: int(t.value), label: "across the fleet" }],
  })), "Radio events across the fleet", 760);
  const c2 = card(root, "Radio counters per node", "Select a column heading to sort; long tables start collapsed", "card block");
  const cols = [["Node", name, ident]].concat(totals.map(t => [t.label, n => n.radio[t.key], int]));
  nodeTable(c2, data.nodes, cols, 0);
})();
</script>
</body>
</html>
